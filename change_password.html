{% extends "base.html" %}
{% block content %}
<section class="page-intro">
  <div><span class="eyebrow">ACCOUNT SECURITY</span>
    <h1>修改登录密码</h1>
    <p>保护校园信息，从一个更安全的密码开始。</p></div>
  <span class="intro-icon">🔒</span>
</section>
<div class="single-column">
  {% if must_change %}
    <div class="notice strong-notice"><strong>首次登录安全提醒</strong><p>系统要求你先更换初始密码，完成后即可进入工作台。</p></div>
  {% endif %}
  <section class="surface">
    <div class="section-header"><h2>密码设置</h2><span class="subtle">账号：{{ auth.username }}</span></div>
    <form method="post" class="stacked-form" action="{{ url_for('change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>原登录密码<input type="password" name="old_password" autocomplete="current-password" required></label>
      <label>新登录密码<input type="password" name="new_password" minlength="8" maxlength="200" autocomplete="new-password" placeholder="不少于 8 位" required></label>
      <label>确认新密码<input type="password" name="confirm_password" minlength="8" maxlength="200" autocomplete="new-password" placeholder="再次输入新密码" required></label>
      <div class="form-foot"><span class="muted">不要继续使用 123456，也不要与原密码相同。</span><button class="btn primary" type="submit">保存新密码 →</button></div>
    </form>
  </section>
</div>
{% endblock %}
